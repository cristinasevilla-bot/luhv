name: syntax-check

# Valida la sintaxis de todo el JavaScript del repo en cada push / PR.
# Si server.js (o cualquier .js) tiene un error de sintaxis, GitHub lo marca
# con una X roja ANTES de que el deploy llegue a Render. Se acaban los
# despliegues rotos por un typo (turn/return, llave de menos, etc.).

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Check JS syntax (node --check)
        run: |
          set -e
          for f in $(git ls-files '*.js'); do
            echo "Checking $f"
            node --check "$f"
          done
